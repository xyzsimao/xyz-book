format:
  html:
    page-layout: full
    css: ../styles.css
    theme:
      light: [cosmo, ../light.scss]
      dark: [darkly, ../dark.scss]
    gargoyle-fonts: false
    mainfont: "PingFang SC"
    sansfont: "PingFang SC"
    grid:
      sidebar-width: 380px
      body-width: 900px
      margin-width: 300px
      gutter-width: 1.5rem

  titlepage-pdf:
    documentclass: scrreprt
    pdf-engine: xelatex
    fontsize: 11pt
    # 中文行距需要比西文松，1.4 倍是简体书籍的常见取值。
    linestretch: 1.4
    geometry: [top=30mm, bottom=30mm, left=32mm, right=32mm]

    # 西文与中文各配一套，sansfont 管 \textsf，CJKsansfont 管中文标题的黑体。
    # 原先的 sansfont: "PingFang SC" 会被 fontconfig 回退到 PingFang HK（港版字形）。
    mainfont: "Times New Roman"
    sansfont: "Helvetica Neue"
    monofont: "Menlo"
    CJKmainfont: "Songti SC"
    CJKsansfont: "Hiragino Sans GB"

    colorlinks: true
    linkcolor: black
    toccolor: black
    citecolor: NavyBlue
    urlcolor: NavyBlue

    include-in-header:
      - file: ../preamble.tex
      - file: ../cjk.tex

    titlepage: plain
    titlepage-logo: ../cover.png
    titlepage-footer: "2026 年 9 月"
    titlepage-theme:
      page-align: center
      # 覆盖 plain 主题默认的元素顺序，前后各加一个 \vfill 让标题块垂直居中，
      # 徽标与日期留在页脚。写成 pandoc 的 raw inline 才能原样传给 LaTeX。
      elements:
        - "`\\vfill`{=latex}"
        - "`\\titleblock`{=latex}"
        - "`\\authorblock`{=latex}"
        - "`\\vfill`{=latex}"
        - "`\\logoblock`{=latex}"
        - "`\\footerblock`{=latex}"
      title-fontsize: 42
      title-fontstyle: [bfseries]
      title-space-after: "2\\baselineskip"
      author-fontsize: 15
      author-space-after: "1\\baselineskip"
      logo-size: "0.10\\paperwidth"
      logo-space-after: "2\\baselineskip"
      footer-fontsize: 11
