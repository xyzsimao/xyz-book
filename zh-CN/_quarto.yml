project:
  type: book
  output-dir: ../docs/zh-CN
  resources:
    - go-en-US.html

lang: zh-Hans

book:
  title: "xyz-book"
  author: "Norah Jones"
  date: "2026/9/17"
  search: true
  repo-url: https://github.com/xyzsimao/xyz-book.git
  repo-actions: [edit]
  downloads: [pdf]
  sharing: [twitter, facebook]
  navbar:
    background: primary
    search: true
    left:
      - text: "首页"
        href: index.qmd
      - text: "关于"
        href: about.html
    right:
      - text: "English"
        href: go-en-US.html
  sidebar:
    style: docked
  chapters:
    - index.qmd
    - part: "正文"
      chapters:
        - content/intro.qmd
        - content/content.qmd
        - content/sample.qmd
        - content/summary.qmd
    - content/references.qmd
    - about.qmd
  comments:
    giscus:
      repo: xyzsimao/xyz-book
      repo-id: R_kgDOUeYasA
      category: Announcements
      category-id: DIC_kwDOUeYasM4DGAOt
      mapping: "pathname"  # 推荐，或使用 "url"
      reactions-enabled: true
      input-position: "bottom"
      theme:
        light: light
        dark: dark

bibliography: ../references.bib

metadata-files:
  - _frontmatter.yml
